<script>
document.addEventListener("DOMContentLoaded", async function() {

// ========================================================================================== MOBILE NAVIGATION ==================
const hamburger = document.querySelector(".hamburger");
const navLinks = document.querySelector(".nav-links");
const dropdownLinks = document.querySelectorAll(".nav-links .dropdown > a");

hamburger.addEventListener("click", function(e) {
e.stopPropagation();
navLinks.classList.toggle("nav-active");
});

dropdownLinks.forEach(link => {
link.addEventListener("click", function(e) {
if (window.innerWidth <= 768) {
e.preventDefault();
const submenu = this.nextElementSibling;
submenu.classList.toggle("dropdown-active");
}
});
});

document.addEventListener("click", function(e) {
if (window.innerWidth <= 768) {
const isClickInsideNav = navLinks.contains(e.target) || hamburger.contains(e.target);
if (!isClickInsideNav) {
navLinks.classList.remove("nav-active");
document.querySelectorAll(".dropdown-content").forEach(sub => sub.classList.remove("dropdown-active"));
}
}
});

// ========================================================================================== STANDINGS ==================
const STANDINGS_CSV = "https://raw.githubusercontent.com/michaelj86768894/big12/main/standings.csv";
const container = document.getElementById("standings-container");
const loading = document.querySelector(".loading");

try {
const res = await fetch(STANDINGS_CSV);
const csv = await res.text();

const rows = csv.trim().split(/\r?\n/);
rows.shift(); // remove header

const standings = {};

rows.forEach(row => {
const [team1, team2, score1, score2, div1, div2] = row.split(",").map(x => x.trim());
const s1 = parseFloat(score1) || 0;
const s2 = parseFloat(score2) || 0;

if (!standings[team1]) standings[team1] = { wins: 0, losses: 0, pf: 0, division: div1 };
if (!standings[team2]) standings[team2] = { wins: 0, losses: 0, pf: 0, division: div2 };

standings[team1].pf += s1;
standings[team2].pf += s2;

if (s1 > s2) {
standings[team1].wins++;
standings[team2].losses++;
} else if (s2 > s1) {
standings[team2].wins++;
standings[team1].losses++;
}
});

const sorted = Object.entries(standings)
.map(([team, stats]) => ({ team, ...stats }))
.sort((a,b) => b.wins - a.wins || b.pf - a.pf);

const divisions = {
East: sorted.filter(t => t.division.toLowerCase() === "east"),
Central: sorted.filter(t => t.division.toLowerCase() === "central"),
West: sorted.filter(t => t.division.toLowerCase() === "west")
};

container.innerHTML = "";

Object.entries(divisions).forEach(([name, teams]) => {
if (!teams.length) return;

const table = document.createElement("table");
table.className = "standings-table";

table.innerHTML = `
<thead>
<tr><th colspan="5">${name} Division</th></tr>
<tr>
<th>#</th><th>Team</th><th>W</th><th>L</th><th>PF</th>
</tr>
</thead>
`;

const tbody = document.createElement("tbody");
teams.forEach((t, i) => {
const tr = document.createElement("tr");
tr.innerHTML = `
<td>${i+1}</td>
<td>${t.team}</td>
<td>${t.wins}</td>
<td>${t.losses}</td>
<td>${t.pf.toFixed(1)}</td>
`;
tbody.appendChild(tr);
});

table.appendChild(tbody);
container.appendChild(table);
});

if (loading) loading.style.display = "none";

} catch(err) {
console.error(err);
if (loading) loading.textContent = "Error loading standings.";
}

// ========================================================================================== LUCKY DUCK ==================
const LUCKY_DUCK_CSV = "https://raw.githubusercontent.com/michaelj86768894/big12/main/luckyduck.csv";
const luckyContainer = document.getElementById("lucky-duck-container");


if (!luckyContainer) return;

try {
const res = await fetch(LUCKY_DUCK_CSV);
const csv = await res.text();

const rows = csv.trim().split(/\r?\n/);
const headers = rows.shift().split(",");

const data = rows.map(r => {
const values = r.split(",");
const obj = {};
headers.forEach((h, i) => obj[h.trim()] = values[i]?.trim());
obj["+/-"] = parseFloat(obj["+/-"]) || 0;
obj.Lucky = parseInt(obj.Lucky) || 0;
obj.Unlucky = parseInt(obj.Unlucky) || 0;
return obj;
});

// Sort descending by +/- column
data.sort((a, b) => b["+/-"] - a["+/-"]);

const table = document.createElement("table");
table.className = "lucky-duck-table";

const thead = document.createElement("thead");
thead.innerHTML = `<tr>${headers.map(h => `<th>${h}</th>`).join("")}</tr>`;
table.appendChild(thead);

const tbody = document.createElement("tbody");
data.forEach(row => {
const tr = document.createElement("tr");
tr.innerHTML = headers.map(h => {
let cell = row[h] ?? "";
let className = "";

if (h === "Lucky") className = "lucky";
if (h === "Unlucky") className = "unlucky";
if (h === "+/-") className = row[h] > 0 ? "plusminus-positive" : row[h] < 0 ? "plusminus-negative" : "";
if (h === "Label") className = row[h]?.toLowerCase() === "lucky" ? "label-lucky" : row[h]?.toLowerCase() === "unlucky" ? "label-unlucky" : "";

return `<td class="${className}">${cell}</td>`;
}).join("");
tbody.appendChild(tr);
});

table.appendChild(tbody);
luckyContainer.innerHTML = "";
luckyContainer.appendChild(table);

} catch (err) {
console.error(err);
luckyContainer.textContent = "Error loading lucky duck data.";
}

});
</script>
